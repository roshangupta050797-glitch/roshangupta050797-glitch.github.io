<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101820; --paper:#F7F5F1; --card:#FFFFFF;
    --line:#E4E0D8; --accent:#B5652A; --accent-ink:#7C3E14;
    --teal:#1F5D5B; --muted:#6B6459;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EFEAE2; --paper:#14181B; --card:#1C2226;
      --line:#2C3336; --accent:#E2833F; --accent-ink:#F2A868;
      --teal:#4FA6A0; --muted:#93897B;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EFEAE2; --paper:#14181B; --card:#1C2226;
    --line:#2C3336; --accent:#E2833F; --accent-ink:#F2A868;
    --teal:#4FA6A0; --muted:#93897B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px; margin:0 auto; padding:28px 20px 60px;}
  header{margin-bottom:26px;}
  h1{
    font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700;
    font-size:clamp(24px,4vw,34px); margin:0 0 4px; letter-spacing:-0.01em;
  }
  .sub{color:var(--muted); font-size:14.5px; margin:0 0 20px;}

  .search-box{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--paper); padding:6px 0 14px;
  }
  .search-box input{
    width:100%; padding:15px 18px; font-size:16.5px;
    border:1.5px solid var(--line); border-radius:12px;
    background:var(--card); color:var(--ink); outline:none;
    font-family:'Inter',sans-serif; transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--teal);}

  .results{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .hint{color:var(--muted); font-size:13.5px; padding:2px 2px 10px;}

  .row{
    display:flex; align-items:center; gap:14px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    cursor:pointer; transition:border-color .15s;
  }
  .row:hover{border-color:var(--teal);}
  .row img.thumb{width:52px; height:52px; border-radius:8px; object-fit:cover; background:var(--line); flex:none;}
  .row .noimg{width:52px; height:52px; border-radius:8px; background:var(--line); flex:none;}
  .row .name{font-weight:600; font-size:15.5px;}
  .row .loc{color:var(--muted); font-size:13px;}
  .row .rate{margin-left:auto; text-align:right; font-family:'Space Grotesk',sans-serif;}
  .row .rate .new{font-weight:700; color:var(--teal); font-size:16px;}
  .row .rate .old{color:var(--muted); text-decoration:line-through; font-size:12.5px;}

  .detail{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px; margin-top:6px;
  }
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
  .detail h2{font-family:'Space Grotesk',sans-serif; margin:0 0 4px; font-size:22px;}
  .detail .loc-line{color:var(--muted); font-size:14px;}
  .close-btn{
    background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px;
  }
  .rates-strip{display:flex; gap:20px; margin:16px 0; flex-wrap:wrap;}
  .rate-pill{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 16px;}
  .rate-pill .lbl{font-size:11.5px; color:var(--muted); margin-bottom:2px;}
  .rate-pill .val{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px;}
  .rate-pill.new .val{color:var(--teal);}
  .rate-pill.old .val{color:var(--muted); text-decoration:line-through;}

  .gallery{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 14px;}
  .gallery img{height:140px; border-radius:10px; object-fit:cover; flex:none;}

  .desc{font-size:14.5px; line-height:1.65; color:var(--ink); margin:6px 0 18px; max-width:70ch;}

  .suppliers{display:flex; flex-wrap:wrap; gap:8px;}
  .sup-chip{
    background:var(--paper); border:1px solid var(--line); border-radius:20px;
    padding:7px 14px; font-size:13.5px;
  }

  details.form{margin-top:30px; border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden;}
  details.form summary{
    padding:16px 18px; cursor:pointer; font-weight:600; font-size:15px;
    list-style:none; display:flex; align-items:center; justify-content:space-between;
  }
  details.form summary::-webkit-details-marker{display:none;}
  details.form summary::after{content:'+'; font-size:20px; color:var(--muted);}
  details.form[open] summary::after{content:'−';}
  .form-body{padding:6px 18px 20px; display:flex; flex-direction:column; gap:12px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){.grid2{grid-template-columns:1fr;}}
  label{font-size:12.5px; color:var(--muted); margin-bottom:4px; display:block;}
  input[type=text], input[type=number], textarea{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:9px;
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:14.5px; outline:none;
  }
  input:focus, textarea:focus{border-color:var(--teal);}
  textarea{resize:vertical; min-height:80px;}
  .field img.prev{width:44px;height:44px;border-radius:6px;object-fit:cover;margin:6px 6px 0 0;}
  .img-preview{display:flex; flex-wrap:wrap;}
  .save-btn{
    margin-top:6px; background:var(--teal); color:#fff; border:none; border-radius:10px;
    padding:13px; font-weight:600; font-size:15px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .save-btn:active{opacity:.85;}
  .msg{font-size:13px; color:var(--teal); min-height:18px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Product Catalog</h1>
    <p class="sub">Search by product name to pull up rate, location, suppliers, photos aur description.</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Product ka naam likhein..." autocomplete="off">
  </div>

  <div id="resultsArea"></div>

  <details class="form" id="formToggle">
    <summary>Naya product save karein</summary>
    <div class="form-body">
      <div class="grid2">
        <div class="field"><label>Product ka naam</label><input type="text" id="f_name"></div>
        <div class="field"><label>Product ka location</label><input type="text" id="f_loc"></div>
        <div class="field"><label>Old rate</label><input type="number" id="f_old"></div>
        <div class="field"><label>New rate</label><input type="number" id="f_new"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Supplier 1</label><input type="text" id="s1"></div>
        <div class="field"><label>Supplier 2</label><input type="text" id="s2"></div>
        <div class="field"><label>Supplier 3</label><input type="text" id="s3"></div>
        <div class="field"><label>Supplier 4</label><input type="text" id="s4"></div>
      </div>
      <div class="field"><label>Supplier 5</label><input type="text" id="s5"></div>
      <div class="field">
        <label>Product ki photos (multiple select karein)</label>
        <input type="file" id="f_images" accept="image/*" multiple>
        <div class="img-preview" id="imgPreview"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="f_desc" placeholder="Product ke baare mein detail likhein..."></textarea></div>
      <button class="save-btn" id="saveBtn">Product save karein</button>
      <div class="msg" id="saveMsg"></div>
    </div>
  </details>
</div>

<script>
const KEY = 'products_v1';
let pendingImages = [];

function loadAll(){
  try{ return JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ return []; }
}
function saveAll(list){
  try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){}
}

const imgInput = document.getElementById('f_images');
const imgPreview = document.getElementById('imgPreview');
imgInput.addEventListener('change', async ()=>{
  pendingImages = [];
  imgPreview.innerHTML = '';
  const files = Array.from(imgInput.files);
  for(const file of files){
    const dataUrl = await new Promise(res=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.readAsDataURL(file);
    });
    pendingImages.push(dataUrl);
    const im = document.createElement('img');
    im.src = dataUrl; im.className = 'prev';
    imgPreview.appendChild(im);
  }
});

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const name = document.getElementById('f_name').value.trim();
  if(!name){
    document.getElementById('saveMsg').textContent = 'Product ka naam zaroori hai.';
    return;
  }
  const product = {
    id: Date.now().toString(),
    name,
    location: document.getElementById('f_loc').value.trim(),
    oldRate: document.getElementById('f_old').value,
    newRate: document.getElementById('f_new').value,
    suppliers: [
      document.getElementById('s1').value.trim(),
      document.getElementById('s2').value.trim(),
      document.getElementById('s3').value.trim(),
      document.getElementById('s4').value.trim(),
      document.getElementById('s5').value.trim(),
    ].filter(Boolean),
    images: pendingImages,
    description: document.getElementById('f_desc').value.trim()
  };
  const list = loadAll();
  list.push(product);
  saveAll(list);
  document.getElementById('saveMsg').textContent = 'Saved! Ab search box mein "' + name + '" likh kar dekhein.';
  ['f_name','f_loc','f_old','f_new','s1','s2','s3','s4','s5','f_desc'].forEach(id=>document.getElementById(id).value='');
  imgInput.value=''; pendingImages=[]; imgPreview.innerHTML='';
  document.getElementById('formToggle').open = false;
  renderResults('');
});

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let openId = null;

function renderResults(query){
  const list = loadAll();
  const area = document.getElementById('resultsArea');
  const q = query.trim().toLowerCase();
  const matches = q ? list.filter(p=>p.name.toLowerCase().includes(q)) : list;

  if(openId){
    const p = list.find(x=>x.id===openId);
    if(p){ area.innerHTML = detailHtml(p); attachDetailEvents(); return; }
    openId = null;
  }

  if(!list.length){
    area.innerHTML = '<p class="hint">Abhi koi product save nahi hua. Neeche form kholkar pehla product add karein.</p>';
    return;
  }
  if(q && !matches.length){
    area.innerHTML = '<p class="hint">"'+escapeHtml(query)+'" naam se koi product nahi mila.</p>';
    return;
  }

  area.innerHTML = '<div class="results">' + matches.map(p=>{
    const thumb = p.images && p.images[0] ? '<img class="thumb" src="'+p.images[0]+'">' : '<div class="noimg"></div>';
    return '<div class="row" data-id="'+p.id+'">'+thumb+
      '<div><div class="name">'+escapeHtml(p.name)+'</div><div class="loc">'+escapeHtml(p.location||'—')+'</div></div>'+
      '<div class="rate">'+(p.newRate?'<div class="new">₹'+escapeHtml(p.newRate)+'</div>':'')+(p.oldRate?'<div class="old">₹'+escapeHtml(p.oldRate)+'</div>':'')+'</div>'+
      '</div>';
  }).join('') + '</div>';

  area.querySelectorAll('.row').forEach(row=>{
    row.addEventListener('click', ()=>{ openId = row.dataset.id; renderResults(document.getElementById('searchInput').value); });
  });
}

function detailHtml(p){
  const gallery = (p.images||[]).map(src=>'<img src="'+src+'">').join('');
  const suppliers = (p.suppliers||[]).map(s=>'<span class="sup-chip">'+escapeHtml(s)+'</span>').join('');
  return '<div class="detail">'+
    '<div class="detail-head"><div><h2>'+escapeHtml(p.name)+'</h2><div class="loc-line">'+escapeHtml(p.location||'—')+'</div></div>'+
    '<button class="close-btn" id="closeDetail">✕ Band karein</button></div>'+
    '<div class="rates-strip">'+
      (p.newRate?'<div class="rate-pill new"><div class="lbl">New rate</div><div class="val">₹'+escapeHtml(p.newRate)+'</div></div>':'')+
      (p.oldRate?'<div class="rate-pill old"><div class="lbl">Old rate</div><div class="val">₹'+escapeHtml(p.oldRate)+'</div></div>':'')+
    '</div>'+
    (gallery?'<div class="gallery">'+gallery+'</div>':'')+
    (p.description?'<p class="desc">'+escapeHtml(p.description)+'</p>':'')+
    (suppliers?'<div class="suppliers">'+suppliers+'</div>':'')+
  '</div>';
}

function attachDetailEvents(){
  const btn = document.getElementById('closeDetail');
  if(btn) btn.addEventListener('click', ()=>{ openId = null; renderResults(document.getElementById('searchInput').value); });
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  openId = null;
  renderResults(e.target.value);
});

renderResults('');
</script>
</body>
</html>
